<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- PDF Document Gradients -->
    <linearGradient id="pdf-doc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#C62828" />
    </linearGradient>

    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- AGY Badge Gradients -->
    <linearGradient id="agy-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Antigravity Orbital Ring around document -->
  <ellipse cx="64" cy="64" rx="54" ry="22" fill="none" stroke="url(#orbit-grad)" stroke-width="2.5" stroke-dasharray="8 4" transform="rotate(-25 64 64)" opacity="0.65" />

  <!-- Main PDF Document Page -->
  <g filter="url(#drop-shadow)">
    <!-- Document Body with Folded Top-Right Corner -->
    <path d="M36 18 H76 L100 42 V102 C100 106.4 96.4 110 92 110 H36 C31.6 110 28 106.4 28 102 V26 C28 21.6 31.6 18 36 18 Z" fill="url(#pdf-doc-grad)" />

    <!-- Folded Corner -->
    <path d="M76 18 V38 C76 40.2 77.8 42 80 42 H100 Z" fill="#991B1B" />
    <path d="M76 18 L100 42 H80 C77.8 42 76 40.2 76 38 V18 Z" fill="url(#fold-grad)" />

    <!-- Document Decorative Text Lines & Reviewer Highlight -->
    <rect x="38" y="58" width="28" height="4" rx="2" fill="#FFFFFF" opacity="0.4" />
    <rect x="38" y="66" width="46" height="4" rx="2" fill="#FFFFFF" opacity="0.4" />
    <!-- Yellow highlight bar representing review annotations -->
    <rect x="38" y="74" width="38" height="5" rx="2.5" fill="#FDE047" opacity="0.9" />
    <rect x="38" y="83" width="22" height="4" rx="2" fill="#FFFFFF" opacity="0.4" />

    <!-- Prominent PDF Badge -->
    <rect x="36" y="32" width="34" height="18" rx="4" fill="#FFFFFF" filter="url(#badge-shadow)" />
    <text x="53" y="45.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="900" fill="#DC2626" text-anchor="middle" letter-spacing="0.5">PDF</text>
  </g>

  <!-- AGY Pill Badge (Lower Right Overlay) -->
  <g filter="url(#badge-shadow)">
    <rect x="64" y="86" width="56" height="26" rx="13" fill="url(#agy-badge-grad)" stroke="url(#orbit-grad)" stroke-width="2" />
    <circle cx="76" cy="99" r="3" fill="#38BDF8" />
    <text x="96" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">AGY</text>
  </g>
</svg>
