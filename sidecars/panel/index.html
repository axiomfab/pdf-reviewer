<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Reviewer</title>
  <script src="/preload.js"></script>
  <script>
    window.reportDebug = function(msg) {
      console.log('[DEBUG]', msg);
      try {
        const fetchFn = (window.sidecar && window.sidecar.fetch) || window.fetch;
        fetchFn('/api/debug_log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, href: window.location.href, time: new Date().toISOString() })
        });
      } catch (e) {}
    };
    window.onerror = function(msg, url, line) {
      window.reportDebug(`ERROR: ${msg} at ${url}:${line}`);
    };
  </script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/comments.css">
  <script src="/lib/pdf.min.js"></script>
</head>
<body>
  <header>
    <div class="header-left">
      <select id="pdf-select" title="Active PDF">
        <option value="">Searching workspace for PDFs...</option>
      </select>
    </div>

    <div class="header-center">
      <div class="mode-switch">
        <button id="mode-text-btn" class="mode-btn active" title="Select Text to Comment">🔤 Text</button>
        <button id="mode-strike-btn" class="mode-btn" title="Select Text to Strike through & Propose Replacement"><s>T</s> Strike</button>
        <button id="mode-note-btn" class="mode-btn" title="Click anywhere to drop a Sticky Note">📌 Note</button>
        <button id="mode-area-btn" class="mode-btn" title="Snip Image / Diagram to Comment">✂️ Snip</button>
      </div>
    </div>

    <div class="header-right">
      <div class="history-controls">
        <button id="undo-btn" class="icon-btn" title="Undo (Ctrl+Z)" disabled>↶</button>
        <button id="redo-btn" class="icon-btn" title="Redo (Ctrl+Y)" disabled>↷</button>
      </div>
      <div class="zoom-controls">
        <button id="zoom-out-btn" title="Zoom Out">−</button>
        <span id="zoom-level">Fit</span>
        <button id="zoom-in-btn" title="Zoom In">+</button>
      </div>
      <button id="comments-toggle-btn" class="toggle-btn" title="Display all comment boxes on page">💬 Show All (<span id="comments-count">0</span>)</button>
      <button id="refresh-btn" title="Force Reload">↻</button>
    </div>
  </header>

  <div id="main-layout">
    <main id="viewer-container">
      <div id="empty-state" class="empty-state">
        <h3>No PDF Detected</h3>
        <p>Compile your LaTeX document (`scripts/build.ps1`) to preview it here.</p>
      </div>
      <div id="pages-container"></div>
    </main>
  </div>

  <div id="comment-popup" class="comment-popup" style="display: none;">
    <div class="popup-header">
      <span id="popup-title">Add PDF Annotation</span>
      <button id="popup-close-btn" class="icon-btn">✕</button>
    </div>
    <div id="popup-preview" class="popup-preview"></div>
    <div id="popup-replacement-group" style="display: none; margin-bottom: 8px;">
      <input type="text" id="popup-replacement-input" placeholder="Replacement text (leave empty to delete)..." />
    </div>
    <textarea id="popup-input" placeholder="Type instruction for Antigravity..." rows="3"></textarea>
    <div class="popup-actions">
      <span id="popup-page-badge" class="badge">Page 1</span>
      <button id="popup-submit-btn" class="primary-btn">Save to PDF</button>
    </div>
  </div>

  <script src="/ui_history.js?v=20261022_7"></script>
  <script src="/ui_comments.js?v=20261022_7"></script>
  <script src="/app.js?v=20261022_7"></script>
</body>
</html>
